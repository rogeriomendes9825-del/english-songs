<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>My English Songs</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #1DB954; --green-dark: #158a3e;
    --bg: #121212; --bg2: #1e1e1e; --bg3: #2a2a2a;
    --text: #f0f0f0; --text2: #aaaaaa;
    --border: rgba(255,255,255,0.12); --radius: 12px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex;
    flex-direction: column; max-width: 520px; margin: 0 auto;
  }

  /* LOGIN */
  #loginScreen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 30px; text-align: center;
  }
  #loginScreen h1 { color: #fff; font-size: 28px; margin-bottom: 12px; }
  #loginScreen p  { color: var(--text2); font-size: 17px; margin-bottom: 28px; line-height: 1.6; max-width: 300px; }
  .btn-spotify {
    display: block; background: var(--green); color: #fff;
    text-decoration: none; padding: 18px 40px; border-radius: 50px;
    font-size: 19px; font-weight: 700; width: 100%; max-width: 320px;
  }
  .btn-spotify:active { background: var(--green-dark); }

  /* APP */
  #appScreen { display: none; flex-direction: column; flex: 1; }
  #appScreen.visible { display: flex; }

  .header {
    background: #000; padding: 16px 16px 12px;
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { color: #fff; font-size: 20px; font-weight: 700; }
  .header h1 span { color: var(--green); }
  .header-sub { color: var(--text2); font-size: 13px; margin-top: 3px; }
  .btn-logout { background: none; border: 1px solid var(--border); color: var(--text2); padding: 7px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }

  #nowPlaying { background: #000; border-bottom: 1px solid var(--border); padding: 10px 14px; display: none; align-items: center; gap: 10px; }
  #nowPlaying.visible { display: flex; }
  #npImg { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; background: var(--bg3); flex-shrink: 0; }
  #npInfo { flex: 1; min-width: 0; }
  #npTitle  { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #npArtist { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .np-btn { background: none; border: none; color: var(--green); font-size: 24px; cursor: pointer; padding: 4px; }

  .search-wrap { padding: 12px 14px 8px; background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 65px; z-index: 8; }
  .search-input-wrap { display: flex; align-items: center; gap: 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 0 14px; }
  #searchInput { flex: 1; border: none; background: transparent; padding: 14px 4px; font-size: 18px; color: var(--text); outline: none; }
  #searchInput::placeholder { color: var(--text2); }
  #clearBtn { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 20px; display: none; padding: 4px; }
  .filter-row { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; font-size: 14px; padding: 7px 16px; border-radius: 20px; border: 1px solid var(--border); color: var(--text2); cursor: pointer; background: var(--bg3); white-space: nowrap; font-weight: 500; }
  .chip.active { background: var(--green); color: #fff; border-color: var(--green); }

  .count-bar { padding: 9px 16px; font-size: 14px; color: var(--text2); border-bottom: 1px solid var(--border); font-weight: 500; }

  #songList { flex: 1; overflow-y: auto; padding-bottom: 100px; }
  .song-item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
  .song-item:active { background: var(--bg2); }
  .song-item.playing .song-title { color: var(--green); }
  .folha-badge { min-width: 34px; height: 34px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text2); flex-shrink: 0; font-weight: 600; }
  .song-body { flex: 1; min-width: 0; }
  .song-title { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  .song-artist { font-size: 15px; color: var(--text2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-tags { display: flex; gap: 6px; margin-top: 5px; }
  .tag { font-size: 12px; padding: 3px 9px; border-radius: 10px; background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
  .btn-play { width: 44px; height: 44px; border-radius: 50%; background: var(--green); border: none; cursor: pointer; font-size: 18px; color: #fff; flex-shrink: 0; }
  .btn-play:active { transform: scale(0.92); }
  .btn-play.loading { background: var(--bg3); }

  .loader { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 60px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-msg { text-align: center; padding: 60px 28px; color: var(--text2); font-size: 17px; line-height: 1.8; }

  .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; background: #000; border-top: 1px solid var(--border); padding: 10px 14px; display: flex; gap: 10px; z-index: 10; }
  .btn-green { flex: 1; background: var(--green); color: #fff; border: none; border-radius: var(--radius); padding: 13px 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-green:active { background: var(--green-dark); }
  .btn-green:disabled { opacity: 0.5; pointer-events: none; }
  .btn-outline { flex: 1; background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 8px; font-size: 15px; font-weight: 500; cursor: pointer; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg2); border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 520px; }
  .modal h2 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .modal p  { font-size: 15px; color: var(--text2); margin-bottom: 20px; }
  .modal input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; font-size: 17px; color: #fff; outline: none; margin-bottom: 14px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button { flex: 1; padding: 14px; border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; border: none; }
  .modal-confirm { background: var(--green); color: #fff; }
  .modal-cancel  { background: var(--bg3); color: var(--text2); }

  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: #333; color: #fff; padding: 12px 22px; border-radius: 24px; font-size: 15px; font-weight: 500; opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  mark { background: rgba(29,185,84,0.3); color: inherit; border-radius: 3px; padding: 0 2px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <h1>🎵 My English Songs</h1>
  <p>Conecte sua conta Spotify Premium para ouvir suas músicas favoritas</p>
  <a class="btn-spotify" id="btnLogin" href="#">Entrar com Spotify</a>
</div>

<!-- APP -->
<div id="appScreen">
  <div class="header">
    <div>
      <h1>🎵 My <span>English</span> Songs</h1>
      <div class="header-sub" id="headerSub">Carregando...</div>
    </div>
    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
  </div>

  <div id="nowPlaying">
    <img id="npImg" src="" alt="">
    <div id="npInfo">
      <div id="npTitle">—</div>
      <div id="npArtist">—</div>
    </div>
    <button class="np-btn" onclick="abrirNoSpotify()">↗</button>

  <div class="search-wrap">

    </div>
  </div>

  <div class="count-bar" id="countBar">Carregando músicas...</div>
  <div id="songList"><div class="loader"></div></div>

  <div class="bottom-bar">
    <button class="btn-green" id="btnPlaylist" onclick="abrirModalPlaylist()">🎶 Criar Playlist</button>
    <button class="btn-outline" onclick="verPlanilha()">📊 Planilha</button>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">

    <h2>🎶 Criar Playlist</h2>
    <p id="modalDesc"></p>
    <input type="text" id="playlistNome" placeholder="Nome da playlist..."/>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="modal-confirm" onclick="confirmarCriarPlaylist()">Criar no Spotify</button>
    </div>
  </div>
</div>

<div id="toast"></div>

  window.onload = function() {

      + '?client_id='    + CLIENT_ID
      + '&response_type=code'
      + '&redirect_uri=' + encodeURIComponent(CALLBACK_URL)
      + '&scope='        + encodeURIComponent(SCOPES)
      + '&show_dialog=true';
    document.getElementById('btnLogin').href = authUrl;

    // Verifica se voltou do callback com o code
    var params = {};
    window.location.search.substring(1).split('&').forEach(function(p) {
      var kv = p.split('=');
      if (kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });

    if (params.code) {
      // Troca o code pelo token diretamente no browser
      document.getElementById('loginScreen').innerHTML =

      trocarCodePorToken(params.code);
      return;
    }

    // Verifica token salvo
    var token   = localStorage.getItem('sp_token');
    var expires = parseInt(localStorage.getItem('sp_expires') || '0');
    if (token && Date.now() < expires) {
      accessToken = token;
      mostrarApp();
    }
    // senão fica na tela de login

  // ── Troca code por token (direto no browser via fetch) ─
  function trocarCodePorToken(code) {
    var body = 'grant_type=authorization_code'
      + '&code='         + encodeURIComponent(code)
      + '&redirect_uri=' + encodeURIComponent(CALLBACK_URL);

    fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: {
        'Content-Type'  : 'application/x-www-form-urlencoded',
        'Authorization' : 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET)
      },
      body: body
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.access_token) {
        accessToken = data.access_token;
        localStorage.setItem('sp_token',   data.access_token);
        localStorage.setItem('sp_refresh', data.refresh_token || '');
        localStorage.setItem('sp_expires', String(Date.now() + (data.expires_in - 60) * 1000));

      }
    })

        + '<a href="' + window.location.pathname + '" style="color:#1DB954;font-size:17px">Tentar novamente</a>';

  }

  function carregarMusicas() {
    todasMusicas     = MUSICAS_DATA;
    musicasFiltradas = MUSICAS_DATA.slice();
    document.getElementById('headerSub').textContent = todasMusicas.length + ' músicas • 1933–1988';
    renderLista(todasMusicas);

    var t;
    document.getElementById('searchInput').addEventListener('input', function() {
      clearTimeout(t);
      t = setTimeout(executarBusca, 200);
      document.getElementById('clearBtn').style.display = this.value ? 'block' : 'none';
    });
  }

  // ── Filtro / Busca ────────────────────────────────────
  function setFiltro(campo, el) {
    filtroAtivo = campo;
    document.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
    el.classList.add('active');
    executarBusca();
  }
  function clearSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('clearBtn').style.display = 'none';
    terminoBusca = '';
    executarBusca();
  }
  function executarBusca() {
    terminoBusca = document.getElementById('searchInput').value.toLowerCase().trim();
    musicasFiltradas = !terminoBusca ? todasMusicas.slice() : todasMusicas.filter(function(m) {
      if (filtroAtivo === 'musica') return m.musica.toLowerCase().includes(terminoBusca);
      if (filtroAtivo === 'cantor') return m.cantor.toLowerCase().includes(terminoBusca);
      if (filtroAtivo === 'ano')    return m.ano.includes(terminoBusca);
      return m.musica.toLowerCase().includes(terminoBusca) ||
             m.cantor.toLowerCase().includes(terminoBusca) ||
             m.ao.includes(terminoBusca);
    });
    renderLista(musicasFiltradas);
  }

  // ── Render ────────────────────────────────────────────
  function hl(t) {
    if (!terminoBusca || !t) return t;
    return t.replace(new RegExp('(' + terminoBusca.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'), '<mark>$1</mark>');
  }
  function renderLista(lista) {
    var bar = document.getElementById('countBar');
    var el  = document.getElementById('songList');
    if (!lista.length) {
      bar.textContent = 'Nenhum resultado';
      el.innerHTML = '<div class="state-msg">🔍<br>Nada encontrado para "' + terminoBusca + '"</div>';
      return;
    }
    bar.textContent = lista.length === todasMusicas.length
      ? lista.length + ' músicas no total'
      : lista.length + ' resultado' + (lista.length > 1 ? 's' : '');
    var html = '';
    lista.forEach(function(m, i) {
      var mE = (m.musica||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      var cE = (m.cantor||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      html += '<div class="song-item" id="item-'+i+'">'
        + '<div class="folha-badge">'+(m.folha||'')+'</div>'
        + '<div class="song-body">'
        + '<div class="song-title">'+hl(m.musica||'')+'</div>'
        + '<div class="song-artist">'+hl(m.cantor||'')+'</div>'
        + '<div class="song-tags"><span class="tag">Aula '+(m.aula||'')+'</span>'
        + (m.ano?'<span class="tag">'+m.ano+'</span>':'')+'</div>'
        + '</div>'
        + '<button class="btn-play" id="btn-'+i+'" onclick="tocar('+i+',\''+mE+'\',\''+cE+'\')">▶</button>'
        + '</div>';
    });
    el.innerHTML = html;
  }

  // ── Tocar via Spotify API direto do browser ───────────
  function tocar(idx, musica, cantor) {
    var btn = document.getElementById('btn-'+idx);
    if (btn) { btn.textContent='⏳'; btn.classList.add('loading'); }
    showToast('Buscando: ' + musica + '...');

    // Busca a faixa
    fetch('https://api.spotify.com/v1/search?q=' + encodeURIComponent(musica + ' ' + cantor) + '&type=track&limit=1', {
      headers: { 'Authorization': 'Bearer ' + accessToken }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var items = data && data.tracks && data.tracks.items;
      if (!items || !items.length) {
        if (btn) { btn.textContent='▶'; btn.classList.remove('loading'); }
        showToast('❌ Música não encontrada no Spotify');
        return;
      }
      var track = items[0];
      tocandoUrl = track.external_urls.spotify;
      atualizarPlayer(track);
      marcarTocando(idx);

      // Toca no dispositivo ativo
      return fetch('https://api.spotify.com/v1/me/player/play', {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ uris: [track.uri] })
      }).then(function(r) {
        if (btn) { btn.textContent='▶'; btn.classList.remove('loading'); }
        if (r.status === 200 || r.status === 204) {
          showToast('▶ Tocando: ' + track.name);
        } else {
          // Abre no app Spotify
          window.open(track.external_urls.spotify, '_blank');
          showToast('Abrindo no Spotify: ' + track.name);
        }
      });
    })
    .catch(function(err) {
      if (btn) { btn.textContent='▶'; btn.classList.remove('loading'); }
      showToast('Erro: ' + err.message);
    });
  }

  function atualizarPlayer(track) {
    document.getElementById('npTitle').textContent  = track.name || '';
    document.getElementById('npArtist').textContent = track.artists ? track.artists[0].name : '';
    if (track.album && track.album.images && track.album.images[0])
      document.getElementById('npImg').src = track.album.images[0].url;
    document.getElementById('nowPlaying').classList.add('visible');
  }
  function marcarTocando(idx) {
    document.querySelectorAll('.song-item').forEach(function(e){ e.classList.remove('playing'); });
    var item = document.getElementById('item-'+idx);
    if (item) item.classList.add('playing');
  }
  function abrirNoSpotify() { if (tocandoUrl) window.open(tocandoUrl,'_blank'); }

  // ── Criar Playlist via Spotify API ───────────────────
  function abrirModalPlaylist() {
    var lista = musicasFiltradas.length ? musicasFiltradas : todasMusicas;
    document.getElementById('playlistNome').value = terminoBusca ? 'English - '+terminoBusca : 'My English Songs';
    document.getElementById('modalDesc').textContent = Math.min(lista.length,50)+' músicas';
    document.getElementById('modalOverlay').classList.add('open');
  }
  function fecharModal() { document.getElementById('modalOverlay').classList.remove('open'); }

  function confirmarCriarPlaylist() {
    var nome  = document.getElementById('playlistNome').value.trim() || 'My English Songs';
    var lista = (musicasFiltradas.length ? musicasFiltradas : todasMusicas).slice(0,50);
    fecharModal();
    var btn = document.getElementById('btnPlaylist');
    btn.disabled = true; btn.textContent = '⏳ Criando...';
    showToast('Criando playlist...');

    // Pega user ID
    fetch('https://api.spotify.com/v1/me', { headers: { 'Authorization': 'Bearer ' + accessToken } })
    .then(function(r) { return r.json(); })
    .then(function(me) {
      return fetch('https://api.spotify.com/v1/users/' + me.id + '/playlists', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: nome, description: 'My English Songs', public: false })
      }).then(function(r) { return r.json(); });
    })
    .then(function(pl) {
      if (!pl.id) throw new Error('Erro ao criar playlist');
      // Busca URIs em sequência
      return buscarUris(lista, 0, [], pl);
    })
    .then(function(resultado) {
      btn.disabled = false; btn.innerHTML = '🎶 Criar Playlist';
      showToast('✅ Playlist criada com ' + resultado.total + ' músicas!');
      setTimeout(function(){ window.open(resultado.url,'_blank'); }, 1500);
    })
    .catch(function(err) {
      btn.disabled = false; btn.innerHTML = '🎶 Criar Playlist';
      showToast('❌ ' + err.message);
    });
  }

  function buscarUris(lista, idx, uris, pl) {
    if (idx >= lista.length) {
      // Adiciona todas as faixas
      return fetch('https://api.spotify.com/v1/playlists/' + pl.id + '/tracks', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ uris: uris })
      }).then(function() {
        return { total: uris.length, url: pl.external_urls.spotify };
      });
    }
    return fetch('https://api.spotify.com/v1/search?q=' + encodeURIComponent(lista[idx].musica + ' ' + lista[idx].cantor) + '&type=track&limit=1', {
      headers: { 'Authorization': 'Bearer ' + accessToken }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.tracks && data.tracks.items && data.tracks.items.length) {
        uris.push(data.tracks.items[0].uri);
      }
      return new Promise(function(resolve) {
        setTimeout(function() { resolve(buscarUris(lista, idx+1, uris, pl)); }, 100);
      });
    });
  }

  function verPlanilha() {
    window.open('https://docs.google.com/spreadsheets/d/199kQDNc1_wFO-EF1qxcGfZCTWwXocAHqqkqr0Omyk3w/edit','_blank');
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 3500);
  }
</script>

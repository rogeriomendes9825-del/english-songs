<html lang="pt-BR">

<meta charset="UTF-8">

<title>My English Songs</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1DB954;--bg:#121212;--bg2:#1e1e1e;--bg3:#2a2a2a;--text:#f0f0f0;--text2:#aaaaaa;--border:rgba(255,255,255,0.12);--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.header{background:#000;padding:16px 16px 12px;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)}
.header h1{color:#fff;font-size:22px;font-weight:700}.header h1 span{color:var(--green)}
.header-sub{color:var(--text2);font-size:14px;margin-top:3px}
.search-wrap{padding:12px 14px 8px;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:68px;z-index:9}
.search-box{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:0 14px}
#searchInput{flex:1;border:none;background:transparent;padding:14px 4px;font-size:19px;color:var(--text);outline:none}
#searchInput::placeholder{color:var(--text2)}
#clearBtn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:22px;display:none;padding:4px}
.filter-row{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:15px;padding:7px 16px;border-radius:20px;border:1px solid var(--border);color:var(--text2);cursor:pointer;background:var(--bg3);white-space:nowrap;font-weight:500}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.count-bar{padding:10px 16px;font-size:14px;color:var(--text2);border-bottom:1px solid var(--border);font-weight:500;display:flex;align-items:center;justify-content:space-between}
.btn-copiar-tudo{background:var(--green);color:#fff;border:none;border-radius:20px;padding:7px 16px;font-size:14px;font-weight:600;cursor:pointer}
#songList{flex:1;overflow-y:auto;padding-bottom:20px}
.song-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
.song-item:active{background:var(--bg2)}
.folha-badge{min-width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text2);flex-shrink:0;font-weight:600}
.song-body{flex:1;min-width:0}
.song-title{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.song-artist{font-size:16px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-tags{display:flex;gap:6px;margin-top:5px}
.tag{font-size:12px;padding:3px 9px;border-radius:10px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-copiar{width:46px;height:46px;border-radius:50%;background:var(--green);border:none;cursor:pointer;font-size:20px;color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.btn-copiar:active{transform:scale(0.92)}
.btn-copiar.copiado{background:#0a7a35}
.loader{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.7s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.state-msg{text-align:center;padding:60px 28px;color:var(--text2);font-size:17px;line-height:1.8}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#1DB954;color:#fff;padding:12px 24px;border-radius:24px;font-size:15px;font-weight:600;opacity:0;transition:all 0.25s;pointer-events:none;z-index:100;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
mark{background:rgba(29,185,84,0.3);color:inherit;border-radius:3px;padding:0 2px}
</style>
</head>

var todasMusicas     = MUSICAS;
var musicasFiltradas = MUSICAS.slice();
var filtroAtivo      = 'todos';
var terminoBusca     = '';

window.onload = function() {
  renderLista(todasMusicas);
  var t;
  document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(t);
    t = setTimeout(executarBusca, 150);
    document.getElementById('clearBtn').style.display = this.value ? 'block' : 'none';
  });
};

function setFiltro(campo, el) {
  filtroAtivo = campo;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');});
  el.classList.add('active');
  executarBusca();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  terminoBusca = '';
  executarBusca();
}

function executarBusca() {
  terminoBusca = document.getElementById('searchInput').value.toLowerCase().trim();
  musicasFiltradas = !terminoBusca ? todasMusicas.slice() : todasMusicas.filter(function(m) {
    if (filtroAtivo === 'musica') return m.musica.toLowerCase().includes(terminoBusca);
    if (filtroAtivo === 'cantor') return m.cantor.toLowerCase().includes(terminoBusca);
    if (filtroAtivo === 'ano')    return m.ano.includes(terminoBusca);
    return m.musica.toLowerCase().includes(terminoBusca) || m.cantor.toLowerCase().includes(terminoBusca) || m.ano.includes(terminoBusca);
  });
  renderLista(musicasFiltradas);
}

function hl(t) {
  if (!terminoBusca || !t) return t;
  return t.replace(new RegExp('('+terminoBusca.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
}

function renderLista(lista) {
  var bar = document.getElementById('countBar');
  var el  = document.getElementById('songList');
  if (!lista.length) {
    bar.textContent = 'Nenhum resultado';
    el.innerHTML = '<div class="state-msg">🔍<br>Nada encontrado para "'+terminoBusca+'"</div>';
    return;
  }
  bar.textContent = lista.length === todasMusicas.length ? lista.length+' músicas no total' : lista.length+' resultado'+(lista.length>1?'s':'');
  var html = '';
  lista.forEach(function(m, i) {
    var texto = m.musica+' - '+m.cantor;
    var textoEsc = texto.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    html += '<div class="song-item">'
      +'<div class="folha-badge">'+m.folha+'</div>'
      +'<div class="song-body">'
      +'<div class="song-title">'+hl(m.musica)+'</div>'
      +'<div class="song-artist">'+hl(m.cantor)+'</div>'
      +'<div class="song-tags"><span class="tag">Aula '+m.aula+'</span>'+(m.ano?'<span class="tag">'+m.ano+'</span>':'')+'</div>'
      +'</div>'
      +'<button class="btn-copiar" id="cbtn-'+i+'" onclick="copiarMusica('+i+',\''+textoEsc+'\',this)" title="Copiar para Spotify">📋</button>'
      +'</div>';
  });
  el.innerHTML = html;
}

function copiarMusica(idx, texto, btn) {
  navigator.clipboard.writeText(texto).then(function() {
    btn.textContent = '✅';
    btn.classList.add('copiado');
    setTimeout(function(){ btn.textContent='📋'; btn.classList.remove('copiado'); }, 2000);
    showToast('Copiado: '+texto);
  }).catch(function() {
    // Fallback
    var ta = document.createElement('textarea');
    ta.value = texto;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✅';
    setTimeout(function(){ btn.textContent='📋'; }, 2000);
    showToast('Copiado: '+texto);
  });
}

function copiarTodos() {
  var lista = musicasFiltradas.length ? musicasFiltradas : todasMusicas;
  var texto = lista.map(function(m){ return m.musica+' - '+m.cantor; }).join('\n');
  navigator.clipboard.writeText(texto).then(function() {
    showToast('✅ '+lista.length+' músicas copiadas!');
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = texto;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✅ '+lista.length+' músicas copiadas!');
  });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

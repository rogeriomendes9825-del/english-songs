<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conectando Spotify...</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #121212; color: #fff;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 20px;
    text-align: center; flex-direction: column; gap: 16px;
  }
  .loader { width: 40px; height: 40px; border: 4px solid #333; border-top-color: #1DB954; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #aaa; font-size: 16px; }
  .erro { color: #ff6b6b; font-size: 15px; }
  a { color: #1DB954; font-size: 15px; }
</style>
</head>
<body>
<div class="loader" id="loader"></div>
<p id="msg">Conectando com Spotify...</p>

<script>
  // Esta página recebe o code do Spotify e envia para o Apps Script
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzrNngTScp0g0C3voj1aabSGf7FM-rpdGJX81biizqwm5OkIHXcqCPtRFsEuyxrMZHK/exec';

  var params = {};
  window.location.search.substring(1).split('&').forEach(function(p) {
    var kv = p.split('=');
    params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
  });

  if (params.error) {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('msg').innerHTML =
      '<span class="erro">❌ Erro: ' + params.error + '</span><br><br>' +
      '<a href="' + APP_URL + '">Voltar ao app</a>';
  } else if (params.code) {
    document.getElementById('msg').textContent = 'Autorizando... aguarde';
    // Redireciona para o Apps Script com o code
    window.location.href = APP_URL + '?code=' + encodeURIComponent(params.code);
  } else {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('msg').innerHTML =
      '<span class="erro">❌ Nenhum código recebido</span><br><br>' +
      '<a href="' + APP_URL + '">Voltar ao app</a>';
  }
</script>
</body>
</html>
